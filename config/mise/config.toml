[bootstrap.packages]
# Terminal
"brew:git" = "latest"
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:jj" = "latest"
"brew:fzf" = "latest"
"brew:ripgrep" = "latest"
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:jq" = "latest"
"brew:tree" = "latest"
"brew:zoxide" = "latest"
"brew:atuin" = "latest"
"brew:lazygit" = "latest"
"brew:gh" = "latest"
# GUI apps
"brew-cask:brave-browser" = "latest"
"brew-cask:bitwarden" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:iina" = "latest"
"brew-cask:keepingyouawake" = "latest"
"brew-cask:appcleaner" = "latest"
"brew-cask:rectangle" = "latest"
"brew-cask:onlyoffice" = "latest"
"brew-cask:itsycal" = "latest"

[dotfiles]
"~/.profile" = "~/dots/.profile"
"~/.gitconfig" = "~/dots/.gitconfig"
"~/.tmux.conf" = "~/dots/.tmux.conf"
"~/.psqlrc" = "~/dots/.psqlrc"
"~/.config/nvim" = "~/dots/config/nvim"
"~/.config/ghostty" = "~/dots/config/ghostty"
"~/.config/jj" = "~/dots/config/jj"
"~/.config/karabiner" = "~/dots/config/karabiner"
"~/.config/atuin" = "~/dots/config/atuin"
"~/.zshrc/homebrew" = { block = "eval \"$(/opt/homebrew/bin/brew shellenv zsh)\"" }
"~/.zshrc/mise" = { block = "eval \"$(~/.local/bin/mise activate zsh)\"" }
"~/.zshrc/profile" = { block = "source ~/.profile" }

[tools]
claude-code = "latest"
codex = "latest"
pi = "latest"
tree-sitter = "latest"
# rust
rust-analyzer = "latest" # keep ahead of rust in PATH
rust = "stable"
# lua
lua-language-server = "latest"
stylua = "latest"
# erlang / elixir
erlang = "latest"
elixir = "latest"
"aqua:remoteoss/dexter" = "latest"
# js / node
node = "latest"
pnpm = "latest"
"npm:typescript" = "latest"
